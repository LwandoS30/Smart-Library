services:
  - type: web
    name: smart-library-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_URL
        value: https://smart-library-frontend.onrender.com
    disk:
      name: smart-library-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

  - type: static
    name: smart-library-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://smart-library-api.onrender.com